
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Pass | CloudPass</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7fb;
            color: #172b4d;
        }

        header {
            background: #102a43;
            color: white;
            padding: 22px 8%;
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 600px;
            margin: 45px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #102a4312;
        }

        h1 { margin-top: 0; }
        .subtitle { color: #627d98; margin-bottom: 28px; }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: 2px solid #14b8a6;
            border-color: transparent;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #0d9488;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #0f766e; }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0d9488;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            main { margin: 20px 14px; padding: 24px; }
        }
    </style>
</head>
<body>
    <header>CloudPass</header>

    <main>
        <h1>Book Your Bus Pass</h1>
        <p class="subtitle">Enter your details to get started.</p>

        <form action="/book" method="POST">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name"
                   maxlength="100" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   maxlength="150" required>

            <label for="plan_id">Choose Your Pass</label>
            <select id="plan_id" name="plan_id" required>
                {% for plan in plans %}
                <option value="{{ plan.plan_id }}">
                    {{ plan.plan_name }} — ₹{{ "%.0f"|format(plan.price) }}
                    ({{ plan.duration_days }} days)
                </option>
                {% endfor %}
            </select>

            <label for="start_date">Pass Start Date</label>
            <input type="date" id="start_date" name="start_date" required>

            <button type="submit">Continue Booking</button>
        </form>

        <a class="back" href="/">← Back to Home</a>
    </main>
</body>
</html>
